# Dependabot: revisión semanal (lunes 07:00 Madrid).
# Menores y parches en un solo PR por ecosistema; las mayores van en PR aparte.
# Nada se fusiona solo: Alberto aprueba cada actualización.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
